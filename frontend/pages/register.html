<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 爱通知</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .password-strength { margin-top: 8px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: .75rem; font-weight: 600; }
        .password-strength.weak { background: var(--danger-50); color: #dc2626; }
        .password-strength.medium { background: var(--warning-50); color: #b45309; }
        .password-strength.strong { background: var(--success-50); color: #16a34a; }
        .password-requirements { margin-top: 8px; font-size: .75rem; color: var(--text-2); }
        .password-requirements ul { margin: 0; padding-left: 18px; }
        .password-requirements li.valid { color: var(--success); }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-logo"><i class="fas fa-bell"></i></span>
                <span>爱通知</span>
            </div>
            <p class="auth-subtitle">创建你的小爱音箱消息推送平台账户</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="3-20位字母/数字/下划线" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">邮箱地址</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱地址" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="displayName" class="form-label">显示名称</label>
                    <input type="text" id="displayName" name="display_name" class="form-input" placeholder="请输入显示名称" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <div class="password-toggle" style="position:relative">
                        <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required autocomplete="new-password" style="padding-right:42px">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('password')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-3);cursor:pointer"><i class="fas fa-eye"></i></button>
                    </div>
                    <div id="passwordStrength" class="password-strength" style="display:none"></div>
                    <div id="passwordRequirements" class="password-requirements" style="display:none">
                        <ul>
                            <li id="req-length">至少8个字符</li>
                            <li id="req-upper">包含大写字母</li>
                            <li id="req-lower">包含小写字母</li>
                            <li id="req-number">包含数字</li>
                            <li id="req-special">包含特殊字符</li>
                        </ul>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">确认密码</label>
                    <div class="password-toggle" style="position:relative">
                        <input type="password" id="confirmPassword" name="confirm_password" class="form-input" placeholder="请再次输入密码" required autocomplete="new-password" style="padding-right:42px">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('confirmPassword')" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-3);cursor:pointer"><i class="fas fa-eye"></i></button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" id="registerBtn">
                    <span class="btn-text">创建账户</span>
                    <span class="loading hidden"></span>
                </button>
            </form>

            <p class="text-center text-secondary mt-xl" style="font-size:.9rem">
                已有账户？ <a href="/login">立即登录</a>
            </p>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script>
        class RegisterPage {
            constructor() {
                this.form = document.getElementById('registerForm');
                this.registerBtn = document.getElementById('registerBtn');
                this.validator = new utils.FormValidator(this.form);
                this.init();
            }
            init() {
                if (window.apiClient.isAuthenticated()) { window.location.href = '/dashboard'; return; }
                this.setupValidation();
                this.bindEvents();
            }
            setupValidation() {
                this.validator
                    .addRule('username', utils.ValidationRules.required('请输入用户名'))
                    .addRule('username', utils.ValidationRules.minLength(3, '用户名至少3个字符'))
                    .addRule('username', utils.ValidationRules.maxLength(20, '用户名最多20个字符'))
                    .addRule('username', utils.ValidationRules.pattern(/^[a-zA-Z0-9_]+$/, '用户名只能包含字母、数字和下划线'))
                    .addRule('email', utils.ValidationRules.required('请输入邮箱地址'))
                    .addRule('email', utils.ValidationRules.email())
                    .addRule('display_name', utils.ValidationRules.required('请输入显示名称'))
                    .addRule('display_name', utils.ValidationRules.maxLength(50, '显示名称最多50个字符'))
                    .addRule('password', utils.ValidationRules.required('请输入密码'))
                    .addRule('password', utils.ValidationRules.password())
                    .addRule('confirm_password', utils.ValidationRules.required('请确认密码'))
                    .addRule('confirm_password', utils.ValidationRules.confirmPassword('password'));
            }
            bindEvents() {
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
                document.getElementById('password').addEventListener('input', (e) => this.checkPasswordStrength(e.target.value));
            }
            checkPasswordStrength(password) {
                const strengthDiv = document.getElementById('passwordStrength');
                const reqDiv = document.getElementById('passwordRequirements');
                if (!password) { strengthDiv.style.display = 'none'; reqDiv.style.display = 'none'; return; }
                strengthDiv.style.display = 'block'; reqDiv.style.display = 'block';
                const result = utils.validatePassword(password);
                strengthDiv.className = `password-strength ${result.strength}`;
                strengthDiv.textContent = { weak: '密码强度：弱', medium: '密码强度：中等', strong: '密码强度：强' }[result.strength];
                const r = result.requirements;
                document.getElementById('req-length').className = r.minLength ? 'valid' : '';
                document.getElementById('req-upper').className = r.hasUpperCase ? 'valid' : '';
                document.getElementById('req-lower').className = r.hasLowerCase ? 'valid' : '';
                document.getElementById('req-number').className = r.hasNumbers ? 'valid' : '';
                document.getElementById('req-special').className = r.hasSpecialChar ? 'valid' : '';
            }
            async handleSubmit(e) {
                e.preventDefault();
                if (!this.validator.validate()) return;
                const formData = this.validator.getData();
                delete formData.confirm_password;
                try {
                    this.setLoading(true);
                    await window.apiClient.register(formData);
                    window.notifications.success('注册成功！请登录您的账户');
                    setTimeout(() => { window.location.href = '/login'; }, 1200);
                } catch (error) {
                    console.error('注册失败:', error);
                    window.notifications.error(error.message || '注册失败，请稍后重试');
                } finally {
                    this.setLoading(false);
                }
            }
            setLoading(loading) {
                this.registerBtn.querySelector('.btn-text').classList.toggle('hidden', loading);
                this.registerBtn.querySelector('.loading').classList.toggle('hidden', !loading);
                this.registerBtn.disabled = loading;
            }
        }
        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const icon = input.parentNode.querySelector('.password-toggle-btn i');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
        }
        document.addEventListener('DOMContentLoaded', () => new RegisterPage());
    </script>
</body>
</html>

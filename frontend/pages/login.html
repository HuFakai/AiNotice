<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 爱通知</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-logo"><i class="fas fa-bell"></i></span>
                <span>爱通知</span>
            </div>
            <p class="auth-subtitle">登录到小爱音箱消息推送统一API平台</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">用户名或邮箱</label>
                    <input type="text" id="username" name="username_or_email" class="form-input"
                           placeholder="请输入用户名或邮箱" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <div class="password-toggle" style="position:relative">
                        <input type="password" id="password" name="password" class="form-input"
                               placeholder="请输入密码" required autocomplete="current-password" style="padding-right:42px">
                        <button type="button" class="password-toggle-btn" onclick="togglePassword()"
                                style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-3);cursor:pointer">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">
                    <span class="btn-text">登录</span>
                    <span class="loading hidden"></span>
                </button>
            </form>

            <p class="text-center text-secondary mt-xl" style="font-size:.9rem">
                还没有账户？ <a href="/register">立即注册</a>
            </p>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script>
        class LoginPage {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.loginBtn = document.getElementById('loginBtn');
                this.validator = new utils.FormValidator(this.form);
                this.init();
            }

            init() {
                if (window.apiClient.isAuthenticated()) {
                    this.redirectToDashboard();
                    return;
                }
                this.setupValidation();
                this.bindEvents();
                this.loadRememberedUsername();
            }

            setupValidation() {
                this.validator
                    .addRule('username_or_email', utils.ValidationRules.required('请输入用户名或邮箱'))
                    .addRule('password', utils.ValidationRules.required('请输入密码'));
            }

            bindEvents() {
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
            }

            loadRememberedUsername() {
                const remembered = localStorage.getItem('remembered_username');
                if (remembered) {
                    document.getElementById('username').value = remembered;
                    document.getElementById('password').focus();
                }
            }

            async handleSubmit(e) {
                e.preventDefault();
                if (!this.validator.validate()) return;
                const formData = this.validator.getData();
                try {
                    this.setLoading(true);
                    await window.apiClient.login(formData);
                    localStorage.setItem('remembered_username', formData.username_or_email);
                    window.notifications.success('登录成功！正在跳转...');
                    setTimeout(() => this.redirectToDashboard(), 800);
                } catch (error) {
                    console.error('登录失败:', error);
                    window.notifications.error(error.message || '登录失败，请检查用户名和密码');
                } finally {
                    this.setLoading(false);
                }
            }

            setLoading(loading) {
                const btnText = this.loginBtn.querySelector('.btn-text');
                const btnLoading = this.loginBtn.querySelector('.loading');
                btnText.classList.toggle('hidden', loading);
                btnLoading.classList.toggle('hidden', !loading);
                this.loginBtn.disabled = loading;
            }

            redirectToDashboard() {
                const redirectTo = new URLSearchParams(window.location.search).get('redirect');
                window.location.href = redirectTo || '/dashboard';
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.password-toggle-btn i');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
        }

        document.addEventListener('DOMContentLoaded', () => new LoginPage());
    </script>
</body>
</html>

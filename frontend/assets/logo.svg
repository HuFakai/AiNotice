<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44a08d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="55" fill="#ffffff" stroke="#f0f0f0" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- 爱心图标 -->
  <g transform="translate(35, 35)">
    <path d="M25 45 C15 35, 5 25, 15 15 C20 10, 30 10, 35 15 C40 10, 50 10, 55 15 C65 25, 55 35, 45 45 L35 55 L25 45 Z" 
          fill="url(#heartGradient)" 
          stroke="#ffffff" 
          stroke-width="2"/>
  </g>
  
  <!-- 通知铃铛 -->
  <g transform="translate(65, 25)">
    <path d="M15 8 C15 6, 13 4, 11 4 C9 4, 7 6, 7 8 C4 8, 2 10, 2 13 L2 18 C2 20, 4 22, 6 22 L16 22 C18 22, 20 20, 20 18 L20 13 C20 10, 18 8, 15 8 Z" 
          fill="url(#bellGradient)" 
          stroke="#ffffff" 
          stroke-width="1.5"/>
    <ellipse cx="11" cy="24" rx="3" ry="2" fill="url(#bellGradient)"/>
    
    <!-- 通知点 -->
    <circle cx="18" cy="6" r="3" fill="#ff4757" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- 音波效果 -->
  <g transform="translate(60, 60)" opacity="0.6">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="15;25;15" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>